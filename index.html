<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Liquid Glass — Optical Bevel & Spring Physics</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #090b10;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; cursor: none; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10;
        }

        /* Minimalistický Apple-style ovládací panel */
        #ui {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 264px;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(20, 22, 30, 0.52);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.94);
            font-size: 12px;
            z-index: 20;
            cursor: default;
        }
        #ui.collapsed .ui-body { display: none; }
        .ui-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
        }
        .ui-toggle {
            font-size: 11px;
            opacity: 0.7;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }
        .ui-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .shapes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        button.shape-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.88);
            border-radius: 10px;
            padding: 6px 4px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        button.shape-btn:hover { background: rgba(255, 255, 255, 0.16); }
        button.shape-btn.active {
            background: rgba(255, 255, 255, 0.26);
            border-color: rgba(255, 255, 255, 0.55);
            color: #fff;
        }
        .control { display: flex; flex-direction: column; gap: 4px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.78);
            font-size: 11px;
        }
        .control-label span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.96);
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ffffff;
            cursor: pointer;
            margin: 0;
        }
        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Liquid Glass...</div>

    <div id="ui">
        <div class="ui-header" id="uiToggle">
            <span>Apple Liquid Glass</span>
            <span class="ui-toggle" id="uiToggleLabel">Hide</span>
        </div>
        <div class="ui-body">
            <div class="shapes">
                <button class="shape-btn active" data-shape="0">Pill</button>
                <button class="shape-btn" data-shape="1">Lens</button>
                <button class="shape-btn" data-shape="2">Squircle</button>
            </div>

            <div class="control">
                <div class="control-label"><span>Pružení (Spring)</span><span id="val-spring">180</span></div>
                <input type="range" id="spring" min="50" max="400" step="5" value="180">
            </div>
            <div class="control">
                <div class="control-label"><span>Tlumení (Damping)</span><span id="val-damping">15.0</span></div>
                <input type="range" id="damping" min="5.0" max="30.0" step="0.5" value="15.0">
            </div>
            <div class="control">
                <div class="control-label"><span>Lom hrany (Refraction)</span><span id="val-refraction">0.055</span></div>
                <input type="range" id="refraction" min="0.01" max="0.14" step="0.005" value="0.055">
            </div>
            <div class="control">
                <div class="control-label"><span>Disperze (Chromatic)</span><span id="val-dispersion">0.18</span></div>
                <input type="range" id="dispersion" min="0.0" max="0.50" step="0.01" value="0.18">
            </div>
            <div class="control">
                <div class="control-label"><span>Jemné mléko (Frost)</span><span id="val-frost">0.35</span></div>
                <input type="range" id="frost" min="0.0" max="1.0" step="0.02" value="0.35">
            </div>
            <div class="control">
                <div class="control-label"><span>Šířka hrany (Bevel)</span><span id="val-bevel">0.036</span></div>
                <input type="range" id="bevel" min="0.012" max="0.075" step="0.002" value="0.036">
            </div>

            <div class="hint">Pohybuj myší • Klikni / podrž pro zvětšení</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. PARAMETRY ---
        const params = {
            shape: 0,          // 0 = Pill, 1 = Circle Lens, 2 = Squircle
            spring: 180.0,     // Tuhost pružiny (rychlá, ale organická odezva)
            damping: 15.0,     // Tlumení (hladký dojezd s lehkým přestřelem)
            refraction: 0.055, // Síla lomu světla na zakřivené hraně
            dispersion: 0.18,  // Jemná spektrální chromatická aberace na okraji
            frost: 0.35,       // Jemné rozostření pozadí (frosted glass)
            bevel: 0.036       // Šířka optického zkosení (menisku) na okraji
        };

        // --- 2. RENDERER & SCÉNA ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        // --- 3. FYZIKA PRUŽINY (Spring-Damper pro pozici, měřítko a jemné protažení) ---
        let aspect = window.innerWidth / window.innerHeight;
        const target = new THREE.Vector2(0.5 * aspect, 0.5);

        const glass = {
            pos: new THREE.Vector2(0.5 * aspect, 0.5),
            vel: new THREE.Vector2(0, 0),
            // Pružinové měřítko (při stisku se nafoukne jako v iOS 26)
            scale: 1.0,
            scaleVel: 0.0,
            targetScale: 1.0,
            // Hladké pružinové protažení ve směru pohybu (squash & stretch bez zubatých vln)
            stretch: new THREE.Vector2(0, 0),
            stretchVel: new THREE.Vector2(0, 0)
        };

        function stepPhysics(dt) {
            const k = params.spring;
            const c = params.damping;

            // 1) Pozice na pružině
            const ax = k * (target.x - glass.pos.x) - c * glass.vel.x;
            const ay = k * (target.y - glass.pos.y) - c * glass.vel.y;
            glass.vel.x += ax * dt;
            glass.vel.y += ay * dt;
            glass.pos.x += glass.vel.x * dt;
            glass.pos.y += glass.vel.y * dt;

            // 2) Měřítko na pružině (tactile press bounce)
            const kScale = 260.0;
            const cScale = 14.0;
            const aScale = kScale * (glass.targetScale - glass.scale) - cScale * glass.scaleVel;
            glass.scaleVel += aScale * dt;
            glass.scale += glass.scaleVel * dt;

            // 3) Jemné elastické protažení podle rychlosti (čistý tekutý pocit)
            const targetStretchX = Math.max(-0.35, Math.min(0.35, glass.vel.x * 0.16));
            const targetStretchY = Math.max(-0.35, Math.min(0.35, glass.vel.y * 0.16));
            const kSt = 200.0;
            const cSt = 14.0;
            glass.stretchVel.x += (kSt * (targetStretchX - glass.stretch.x) - cSt * glass.stretchVel.x) * dt;
            glass.stretchVel.y += (kSt * (targetStretchY - glass.stretch.y) - cSt * glass.stretchVel.y) * dt;
            glass.stretch.x += glass.stretchVel.x * dt;
            glass.stretch.y += glass.stretchVel.y * dt;
        }

        // --- 4. APPLE LIQUID GLASS SHADER ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform sampler2D uImage;
            uniform vec2 uResolution;
            uniform vec2 uImageRes;

            uniform vec2 uPos;
            uniform vec2 uStretch;
            uniform float uScale;
            uniform int uShape;

            uniform float uRefraction;
            uniform float uDispersion;
            uniform float uFrost;
            uniform float uBevel;

            varying vec2 vUv;

            vec2 cover(vec2 uv, vec2 resolution, vec2 texResolution) {
                vec2 s = resolution;
                vec2 i = texResolution;
                float rs = s.x / s.y;
                float ri = i.x / i.y;
                vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
                vec2 offset = (rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0)) / newSize;
                return uv * s / newSize + offset;
            }

            // Rounded box SDF (základ pro Pill i Squircle)
            float sdRoundedBox(vec2 p, vec2 b, float r) {
                vec2 q = abs(p) - b + r;
                return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
            }

            // Čisté SDF tvaru Liquid Glass + jemné pružné protažení podle pohybu
            float glassSDF(vec2 p) {
                vec2 d = p - uPos;

                // Elastické protažení po směru rychlosti (zachování plochy)
                float stMag = length(uStretch);
                if (stMag > 0.0005) {
                    vec2 dir = uStretch / stMag;
                    vec2 perp = vec2(-dir.y, dir.x);
                    float s = 1.0 + stMag * 0.45;
                    d = dir * (dot(d, dir) / s) + perp * (dot(d, perp) * s);
                }

                d /= uScale;

                if (uShape == 0) {
                    // Apple Pill (kapsle)
                    return sdRoundedBox(d, vec2(0.145, 0.068), 0.068) * uScale;
                } else if (uShape == 1) {
                    // Kruhová lupa (Lens)
                    return (length(d) - 0.105) * uScale;
                } else {
                    // Apple Squircle / Rounded Rect
                    return sdRoundedBox(d, vec2(0.115, 0.088), 0.038) * uScale;
                }
            }

            // Vzorkování pozadí s volitelným jemným "frosted" rozostřením
            vec3 sampleBlurred(vec2 uv, float blurAmount) {
                if (blurAmount <= 0.0002) {
                    return texture2D(uImage, clamp(uv, 0.001, 0.999)).rgb;
                }
                vec3 sum = texture2D(uImage, clamp(uv, 0.001, 0.999)).rgb * 0.20;
                // 8-směrný Poisson / kruhový vzorek pro čistý optický frost bez šumu
                for (int i = 0; i < 8; i++) {
                    float a = float(i) * 0.78539816; // PI / 4
                    vec2 off = vec2(cos(a), sin(a)) * blurAmount;
                    sum += texture2D(uImage, clamp(uv + off, 0.001, 0.999)).rgb * 0.10;
                }
                return sum;
            }

            void main() {
                float aspect = uResolution.x / uResolution.y;
                vec2 p = vec2(vUv.x * aspect, vUv.y);
                vec2 bgUv = cover(vUv, uResolution, uImageRes);

                float sdf = glassSDF(p);

                // Velmi jemný, vzdušný stín pod sklem (Apple styl: nešpiní pozadí)
                vec3 bgColor = texture2D(uImage, bgUv).rgb;
                float shadowSdf = glassSDF(p - vec2(0.004, -0.012));
                float shadow = smoothstep(0.045, -0.01, shadowSdf);
                bgColor *= 1.0 - shadow * 0.14;

                float aa = 0.0018;
                float mask = smoothstep(aa, -aa, sdf);

                if (mask <= 0.001) {
                    gl_FragColor = vec4(bgColor, 1.0);
                    return;
                }

                // 1. Gradient SDF -> směr normály na hraně (bevel)
                float eps = 0.0018;
                vec2 grad = normalize(vec2(
                    glassSDF(p + vec2(eps, 0.0)) - glassSDF(p - vec2(eps, 0.0)),
                    glassSDF(p + vec2(0.0, eps)) - glassSDF(p - vec2(0.0, eps))
                ) + 1e-6);

                // Vzdálenost od okraje dovnitř: 0 na hraně, 1 za koncem bevelu
                float distIn = max(0.0, -sdf);
                float t = clamp(distIn / uBevel, 0.0, 1.0);

                // Profil zakřivení Apple Liquid Glass:
                // Silný, hladký lom na hraně (t -> 0), uprostřed (t = 1) téměř čiré 1:1
                float curve = pow(1.0 - t, 1.85);
                // Mírné zvětšení (lupa) uvnitř celého skla směrem ke středu
                vec2 centerDir = (p - uPos) * vec2(1.0 / aspect, 1.0);
                vec2 baseRefractUv = bgUv - centerDir * 0.035;

                // Lom světla přes zakřivenou hranu (Snellův profil)
                vec2 bevelOffset = -grad * curve * uRefraction;
                bevelOffset.x /= aspect;

                // 2. REÁLNÁ CHROMATICKÁ ABERACE (jen na zakřivené hraně)
                float blurRadius = uFrost * 0.0045;
                float disp = uDispersion * curve;

                vec2 uvR = baseRefractUv + bevelOffset * (1.0 - disp);
                vec2 uvG = baseRefractUv + bevelOffset;
                vec2 uvB = baseRefractUv + bevelOffset * (1.0 + disp);

                float r = sampleBlurred(uvR, blurRadius).r;
                float g = sampleBlurred(uvG, blurRadius).g;
                float b = sampleBlurred(uvB, blurRadius).b;
                vec3 glassBg = vec3(r, g, b);

                // 3. FRESNEL & SVĚTELNÁ ČISTOTA (Liquid Glass není tmavé, ale projasněné)
                // Jemný mléčný/světelný závoj + mírné zvýšení kontrastu/jasu
                glassBg = mix(glassBg, vec3(1.0), 0.06 + uFrost * 0.06);

                // 4. SIGNATURNÍ APPLE LIQUID GLASS HRANY A ODLESKY
                // Směr světla zleva nahoře (~135°); protilehlý odlesk vpravo dole (~-45°)
                vec2 lightDir = normalize(vec2(-0.707, 0.707));
                float align = dot(grad, lightDir);

                // Dva protilehlé úhlové laloky (typický Apple křížový odlesk na rozích/hranách)
                float lobeTopLeft = pow(max(0.0, align), 3.5);
                float lobeBottomRight = pow(max(0.0, -align), 4.5) * 0.72;
                float diagonalIntensity = lobeTopLeft + lobeBottomRight;

                // a) Ostrý 1px vnější skleněný lem (hairline) po celém obvodu
                float hairline = smoothstep(0.0032, 0.0004, distIn);
                // b) Měkký odlesk na zakřivené hraně (bevel catchlight — dává pocit tloušťky skla)
                float bevelSheen = smoothstep(uBevel * 0.55, 0.001, distIn) * (1.0 - smoothstep(0.001, 0.0, distIn));
                // c) Jemná vnitřní linka odrazu uvnitř menisku
                float innerLip = exp(-pow((distIn - uBevel * 0.22) / (uBevel * 0.14), 2.0));

                // Barva odlesku: čistě bílá špička + lehké zabarvení z lomeného pozadí (total internal reflection)
                vec3 tintedSpec = mix(vec3(1.0), normalize(glassBg + 0.15) * 1.15, 0.28);

                vec3 rimHighlight =
                    vec3(1.0) * hairline * (0.14 + 0.86 * diagonalIntensity) +
                    tintedSpec * bevelSheen * (0.06 + 0.34 * diagonalIntensity) +
                    vec3(0.95, 0.98, 1.0) * innerLip * (0.03 + 0.18 * lobeTopLeft);

                vec3 glassColor = glassBg + rimHighlight;

                vec3 finalColor = mix(bgColor, glassColor, mask);
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        let material = null;
        const loader = new THREE.TextureLoader();
        // Barevnější, kontrastní pozadí, na kterém Apple Liquid Glass krásně vynikne
        const imgUrl = 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop';

        loader.load(imgUrl, (texture) => {
            document.getElementById('loading').style.display = 'none';
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            material = new THREE.ShaderMaterial({
                uniforms: {
                    uImage: { value: texture },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uImageRes: { value: new THREE.Vector2(texture.image.width, texture.image.height) },
                    uPos: { value: glass.pos.clone() },
                    uStretch: { value: glass.stretch.clone() },
                    uScale: { value: 1.0 },
                    uShape: { value: params.shape },
                    uRefraction: { value: params.refraction },
                    uDispersion: { value: params.dispersion },
                    uFrost: { value: params.frost },
                    uBevel: { value: params.bevel }
                },
                vertexShader,
                fragmentShader
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
            scene.add(plane);
        });

        // --- 5. OVLÁDÁNÍ MYŠÍ / DOTYKEM ---
        function updateTarget(clientX, clientY) {
            target.x = (clientX / window.innerWidth) * aspect;
            target.y = 1.0 - clientY / window.innerHeight;
        }

        window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.clientX, e.clientY);
            glass.targetScale = 1.14; // iOS 26 tactile swell při stisku
        });
        window.addEventListener('mouseup', () => {
            glass.targetScale = 1.0;
        });
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
            glass.targetScale = 1.14;
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', () => {
            glass.targetScale = 1.0;
        });

        // --- 6. UI LOGIKA ---
        const ui = document.getElementById('ui');
        const uiToggle = document.getElementById('uiToggle');
        const uiToggleLabel = document.getElementById('uiToggleLabel');
        uiToggle.addEventListener('click', () => {
            ui.classList.toggle('collapsed');
            uiToggleLabel.textContent = ui.classList.contains('collapsed') ? 'Show' : 'Hide';
        });

        document.querySelectorAll('.shape-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                params.shape = parseInt(btn.dataset.shape, 10);
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        const sliderKeys = ['spring', 'damping', 'refraction', 'dispersion', 'frost', 'bevel'];
        for (const key of sliderKeys) {
            document.getElementById(key).addEventListener('input', (e) => {
                params[key] = parseFloat(e.target.value);
                const label = document.getElementById('val-' + key);
                label.textContent = key === 'spring' ? params[key].toFixed(0) :
                                    key === 'damping' ? params[key].toFixed(1) :
                                    (key === 'refraction' || key === 'bevel') ? params[key].toFixed(3) :
                                    params[key].toFixed(2);
            });
        }

        // --- 7. RENDER & PHYSICS LOOP ---
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min((now - lastTime) / 1000, 1 / 30);
            lastTime = now;

            const substeps = 2;
            const subDt = dt / substeps;
            for (let i = 0; i < substeps; i++) {
                stepPhysics(subDt);
            }

            if (material) {
                material.uniforms.uPos.value.copy(glass.pos);
                material.uniforms.uStretch.value.copy(glass.stretch);
                material.uniforms.uScale.value = glass.scale;
                material.uniforms.uShape.value = params.shape;
                material.uniforms.uRefraction.value = params.refraction;
                material.uniforms.uDispersion.value = params.dispersion;
                material.uniforms.uFrost.value = params.frost;
                material.uniforms.uBevel.value = params.bevel;

                renderer.render(scene, camera);
            }
        }

        requestAnimationFrame(animate);

        // --- 8. RESIZE ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            aspect = w / h;
            renderer.setSize(w, h);
            if (material) {
                material.uniforms.uResolution.value.set(w, h);
            }
        });
    </script>
</body>
</html>
