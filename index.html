<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical & Chemical Liquid Glass — Sellmeier, Fresnel, Beer-Lambert</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #090b10;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; cursor: none; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10;
        }

        #ui {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 280px;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(18, 20, 28, 0.56);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.24);
            color: rgba(255, 255, 255, 0.94);
            font-size: 12px;
            z-index: 20;
            cursor: default;
        }
        #ui.collapsed .ui-body { display: none; }
        .ui-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
        }
        .ui-toggle {
            font-size: 11px;
            opacity: 0.7;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }
        .ui-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: -4px;
        }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button.btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.88);
            border-radius: 9px;
            padding: 6px 4px;
            font-size: 10.5px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        button.btn:hover { background: rgba(255, 255, 255, 0.16); }
        button.btn.active {
            background: rgba(255, 255, 255, 0.26);
            border-color: rgba(255, 255, 255, 0.55);
            color: #fff;
        }
        .control { display: flex; flex-direction: column; gap: 3px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.78);
            font-size: 11px;
        }
        .control-label span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.96);
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ffffff;
            cursor: pointer;
            margin: 0;
        }
        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.52);
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Physical Liquid Glass...</div>

    <div id="ui">
        <div class="ui-header" id="uiToggle">
            <span>Physical Liquid Glass</span>
            <span class="ui-toggle" id="uiToggleLabel">Hide</span>
        </div>
        <div class="ui-body">
            <div class="section-label">Tvar (SDF)</div>
            <div class="grid-3">
                <button class="btn shape-btn active" data-shape="0">Pill</button>
                <button class="btn shape-btn" data-shape="1">Lens</button>
                <button class="btn shape-btn" data-shape="2">Squircle</button>
            </div>

            <div class="section-label">Chemické složení (Sellmeier)</div>
            <div class="grid-2">
                <button class="btn mat-btn active" data-mat="bk7">BK7 Borosilikát</button>
                <button class="btn mat-btn" data-mat="sf11">SF11 Olovnaté</button>
                <button class="btn mat-btn" data-mat="sodalime">Soda-Lime (Fe²⁺)</button>
                <button class="btn mat-btn" data-mat="water">Voda (H₂O)</button>
            </div>

            <div class="control">
                <div class="control-label"><span>Vlastní frekvence (ω₀)</span><span id="val-omega">14.0</span></div>
                <input type="range" id="omega" min="6" max="26" step="0.5" value="14.0">
            </div>
            <div class="control">
                <div class="control-label"><span>Poměr tlumení (ζ)</span><span id="val-zeta">0.55</span></div>
                <input type="range" id="zeta" min="0.20" max="1.20" step="0.02" value="0.55">
            </div>
            <div class="control">
                <div class="control-label"><span>Tloušťka čočky (H)</span><span id="val-thickness">0.032</span></div>
                <input type="range" id="thickness" min="0.008" max="0.075" step="0.002" value="0.032">
            </div>
            <div class="control">
                <div class="control-label"><span>Šířka menisku (Bevel)</span><span id="val-bevel">0.038</span></div>
                <input type="range" id="bevel" min="0.012" max="0.080" step="0.002" value="0.038">
            </div>
            <div class="control">
                <div class="control-label"><span>Jemné mléko (Frost)</span><span id="val-frost">0.25</span></div>
                <input type="range" id="frost" min="0.0" max="1.0" step="0.02" value="0.25">
            </div>

            <div class="hint">Sellmeier • Fresnel (s/p) • Beer-Lambert • TIR</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. CHEMICKÉ A OPTICKÉ KONSTANTY MATERIÁLŮ ---
        // Reálné indexy lomu n_d (587.6 nm), disperzní koeficienty (Cauchy B v µm²)
        // a Beer-Lambertova absorpční spektra σ(R,G,B) (např. Fe²⁺ v sodnovápenatém skle)
        const materials = {
            bk7: {
                nd: 1.5168,        // N-BK7 borosilikátové sklo (SiO2 + B2O3)
                cauchyB: 0.0042,   // Nízká disperze (Abbe V_d ~ 64.17)
                absorption: [0.2, 0.08, 0.12]
            },
            sf11: {
                nd: 1.7847,        // N-SF11 těžké flintové sklo (PbO / TiO2)
                cauchyB: 0.0165,   // Vysoká disperze (Abbe V_d ~ 25.76) -> silný hranol
                absorption: [0.35, 0.25, 0.45]
            },
            sodalime: {
                nd: 1.5200,        // Klasické sodnovápenaté sklo s ionty Fe²⁺/Fe³⁺
                cauchyB: 0.0052,   // Abbe V_d ~ 58
                absorption: [2.8, 0.35, 1.1] // Pohlcuje červenou -> typický nazelenalý/azurový okraj
            },
            water: {
                nd: 1.3330,        // Čistá voda H2O
                cauchyB: 0.0031,   // Abbe V_d ~ 55.7
                absorption: [1.4, 0.15, 0.05] // Slabá absorpce v červené (modrozelený nádech)
            }
        };

        const params = {
            shape: 0,
            omega: 14.0,       // Vlastní úhlová frekvence ω₀ (rad/s)
            zeta: 0.55,        // Poměr tlumení ζ (< 1 podtlumený pružný kmit, = 1 kritický)
            thickness: 0.032,  // Maximální fyzická výška H kapky
            bevel: 0.038,      // Šířka zakřiveného menisku
            frost: 0.25,
            mat: materials.bk7
        };

        // --- 2. RENDERER & SCÉNA ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        // --- 3. MATEMATICKÝ TLUMENÝ HARMONICKÝ OSCILÁTOR (RK2 / Symplectic) ---
        // Diferenciální rovnice: x'' + 2 * ζ * ω₀ * x' + ω₀² * (x - target) = 0
        let aspect = window.innerWidth / window.innerHeight;
        const target = new THREE.Vector2(0.5 * aspect, 0.5);

        const glass = {
            pos: new THREE.Vector2(0.5 * aspect, 0.5),
            vel: new THREE.Vector2(0, 0),
            scale: 1.0,
            scaleVel: 0.0,
            targetScale: 1.0,
            stretch: new THREE.Vector2(0, 0),
            stretchVel: new THREE.Vector2(0, 0)
        };

        function stepPhysics(dt) {
            const w0 = params.omega;
            const z = params.zeta;
            const k = w0 * w0;
            const c = 2.0 * z * w0;

            // 1) Pozice (harmonický oscilátor)
            const ax = k * (target.x - glass.pos.x) - c * glass.vel.x;
            const ay = k * (target.y - glass.pos.y) - c * glass.vel.y;
            glass.vel.x += ax * dt;
            glass.vel.y += ay * dt;
            glass.pos.x += glass.vel.x * dt;
            glass.pos.y += glass.vel.y * dt;

            // 2) Měřítko (rychlejší oscilátor při stisku)
            const wS = 18.0, zS = 0.45;
            const aS = (wS * wS) * (glass.targetScale - glass.scale) - (2.0 * zS * wS) * glass.scaleVel;
            glass.scaleVel += aS * dt;
            glass.scale += glass.scaleVel * dt;

            // 3) Objem zachovávající elastické protažení (det(F) = 1)
            const tSx = Math.max(-0.4, Math.min(0.4, glass.vel.x * 0.14));
            const tSy = Math.max(-0.4, Math.min(0.4, glass.vel.y * 0.14));
            const wSt = 16.0, zSt = 0.5;
            glass.stretchVel.x += ((wSt * wSt) * (tSx - glass.stretch.x) - (2.0 * zSt * wSt) * glass.stretchVel.x) * dt;
            glass.stretchVel.y += ((wSt * wSt) * (tSy - glass.stretch.y) - (2.0 * zSt * wSt) * glass.stretchVel.y) * dt;
            glass.stretch.x += glass.stretchVel.x * dt;
            glass.stretch.y += glass.stretchVel.y * dt;
        }

        // --- 4. FYZIKÁLNÍ & CHEMICKÝ SHADER ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform sampler2D uImage;
            uniform vec2 uResolution;
            uniform vec2 uImageRes;

            uniform vec2 uPos;
            uniform vec2 uStretch;
            uniform float uScale;
            uniform int uShape;

            uniform float uNd;           // Index lomu při 587.6 nm (Fraunhofer d-line)
            uniform float uCauchyB;      // Disperzní koeficient B (µm²)
            uniform vec3 uAbsorption;    // Beer-Lambert σ(R,G,B)
            uniform float uThickness;    // Fyzická výška kapky H
            uniform float uBevel;        // Šířka zakřiveného menisku
            uniform float uFrost;

            varying vec2 vUv;

            vec2 cover(vec2 uv, vec2 resolution, vec2 texResolution) {
                vec2 s = resolution;
                vec2 i = texResolution;
                float rs = s.x / s.y;
                float ri = i.x / i.y;
                vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
                vec2 offset = (rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0)) / newSize;
                return uv * s / newSize + offset;
            }

            float sdRoundedBox(vec2 p, vec2 b, float r) {
                vec2 q = abs(p) - b + r;
                return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
            }

            float glassSDF(vec2 p) {
                vec2 d = p - uPos;
                float stMag = length(uStretch);
                if (stMag > 0.0005) {
                    vec2 dir = uStretch / stMag;
                    vec2 perp = vec2(-dir.y, dir.x);
                    float s = 1.0 + stMag * 0.42;
                    // Objem zachovávající transformace: s * (1/s) = 1
                    d = dir * (dot(d, dir) / s) + perp * (dot(d, perp) * s);
                }
                d /= uScale;
                if (uShape == 0) return sdRoundedBox(d, vec2(0.145, 0.068), 0.068) * uScale;
                if (uShape == 1) return (length(d) - 0.105) * uScale;
                return sdRoundedBox(d, vec2(0.115, 0.088), 0.038) * uScale;
            }

            // Analytický profil 3D výšky z(sdf) s hladkým C¹ přechodem do plochého středu
            float surfaceHeight(float sdf) {
                float distIn = max(0.0, -sdf);
                float t = clamp(distIn / uBevel, 0.0, 1.0);
                // Čtvrt-eliptický meniskus: z = H * sqrt(1 - (1 - t)^2)
                return uThickness * sqrt(max(0.0, 1.0 - (1.0 - t) * (1.0 - t)));
            }

            // Přesný Fresnelův koeficient odrazu pro nepolarizované světlo: R = 0.5 * (Rs + Rp)
            float exactFresnel(float cosI, float n1, float n2) {
                float eta = n1 / n2;
                float sinT2 = eta * eta * (1.0 - cosI * cosI);
                if (sinT2 >= 1.0) return 1.0; // Totální vnitřní odraz (TIR)
                float cosT = sqrt(1.0 - sinT2);
                float rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
                float rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
                return 0.5 * (rs * rs + rp * rp);
            }

            // Cauchyho disperzní rovnice: n(λ) = n_d + B * (1/λ² - 1/λ_d²)
            // λ v mikrometrech, λ_d = 0.5876 µm
            float dispersionIOR(float lambdaUm) {
                return uNd + uCauchyB * (1.0 / (lambdaUm * lambdaUm) - 2.89626);
            }

            vec3 sampleBg(vec2 uv, float blurAmount) {
                if (blurAmount <= 0.0002) {
                    return texture2D(uImage, clamp(uv, 0.001, 0.999)).rgb;
                }
                vec3 sum = texture2D(uImage, clamp(uv, 0.001, 0.999)).rgb * 0.20;
                for (int i = 0; i < 8; i++) {
                    float a = float(i) * 0.78539816;
                    vec2 off = vec2(cos(a), sin(a)) * blurAmount;
                    sum += texture2D(uImage, clamp(uv + off, 0.001, 0.999)).rgb * 0.10;
                }
                return sum;
            }

            // Dvoustupňové trasování paprsku pro danou vlnovou délku λ:
            // Vzduch (n=1) -> Horní zakřivená plocha skla -> Průchod tloušťkou z -> Dolní rovina -> Pozadí
            float traceWavelength(vec2 bgUv, vec3 V, vec3 N, float z, float lambdaUm, float aspect, float blur, out float pathLen, int channel) {
                float n = dispersionIOR(lambdaUm);
                // 1. Lom na horním rozhraní (vzduch -> sklo)
                vec3 T1 = refract(V, N, 1.0 / n);
                // Délka dráhy paprsku uvnitř média (pro Beer-Lambertův zákon)
                pathLen = z / max(abs(T1.z), 0.25);

                // Posun uvnitř skla před výstupem na spodní straně
                vec2 shift1 = T1.xy * pathLen;

                // 2. Lom na spodním rozhraní (sklo -> vzduch, normála (0,0,1))
                vec3 T2 = refract(T1, vec3(0.0, 0.0, 1.0), n);
                vec2 totalShift;
                if (length(T2) < 0.001) {
                    // Totální vnitřní odraz (TIR) na spodní hraně — světlo se odráží z okraje
                    totalShift = shift1 - T1.xy * (z * 1.5);
                } else {
                    // Projekce na pozadí za sklem (vzdálenost pozadí ~ 1.4 * uThickness)
                    totalShift = shift1 + T2.xy / max(abs(T2.z), 0.2) * (uThickness * 1.4);
                }
                totalShift.x /= aspect;

                vec3 col = sampleBg(bgUv + totalShift, blur);
                return channel == 0 ? col.r : (channel == 1 ? col.g : col.b);
            }

            void main() {
                float aspect = uResolution.x / uResolution.y;
                vec2 p = vec2(vUv.x * aspect, vUv.y);
                vec2 bgUv = cover(vUv, uResolution, uImageRes);

                float sdf = glassSDF(p);
                vec3 bgColor = texture2D(uImage, bgUv).rgb;

                // Velmi jemný stín pod čočkou
                float shadowSdf = glassSDF(p - vec2(0.004, -0.011));
                float shadow = smoothstep(0.042, -0.01, shadowSdf);
                bgColor *= 1.0 - shadow * 0.14;

                float aa = 0.0018;
                float mask = smoothstep(aa, -aa, sdf);
                if (mask <= 0.001) {
                    gl_FragColor = vec4(bgColor, 1.0);
                    return;
                }

                // 1. Přesná 3D normála povrchu N = normalize(-∂z/∂x, -∂z/∂y, 1)
                float eps = 0.0016;
                float zC = surfaceHeight(sdf);
                float zR = surfaceHeight(glassSDF(p + vec2(eps, 0.0)));
                float zL = surfaceHeight(glassSDF(p - vec2(eps, 0.0)));
                float zT = surfaceHeight(glassSDF(p + vec2(0.0, eps)));
                float zB = surfaceHeight(glassSDF(p - vec2(0.0, eps)));

                float dzdx = (zR - zL) / (2.0 * eps);
                float dzdy = (zT - zB) / (2.0 * eps);
                vec3 N = normalize(vec3(-dzdx, -dzdy, 1.0));

                // Pohledový paprsek (mírně perspektivní)
                vec3 V = normalize(vec3((vUv - 0.5) * 0.16, -1.0));
                float cosI = clamp(dot(-V, N), 0.0, 1.0);

                // 2. Spektrální refrakce (630 nm Červená, 532 nm Zelená, 465 nm Modrá)
                float blur = uFrost * 0.0045;
                float pathR, pathG, pathB;
                float tR = traceWavelength(bgUv, V, N, zC, 0.630, aspect, blur, pathR, 0);
                float tG = traceWavelength(bgUv, V, N, zC, 0.532, aspect, blur, pathG, 1);
                float tB = traceWavelength(bgUv, V, N, zC, 0.465, aspect, blur, pathB, 2);
                vec3 transmitted = vec3(tR, tG, tB);

                // 3. Chemická absorpce — Beer-Lambertův zákon: I = I₀ * exp(-σ * l)
                vec3 beerLambert = exp(-uAbsorption * vec3(pathR, pathG, pathB) * 6.0);
                transmitted *= beerLambert;

                // 4. Přesný Fresnelův odraz (zachování energie: R + T = 1)
                float F = exactFresnel(cosI, 1.0, uNd);
                vec3 Rdir = reflect(V, N);
                float sky = smoothstep(-0.15, 0.85, Rdir.y);
                vec3 envReflect = mix(vec3(0.45, 0.52, 0.65), vec3(1.0, 1.0, 1.0), sky);

                // Kombinace lomeného a odraženého světla podle zachování energie
                vec3 glassColor = transmitted * (1.0 - F) + envReflect * F;

                // 5. Apple diagonální odlesky na hraně (fyzikální Blinn-Phong + ostrý lem)
                float distIn = max(0.0, -sdf);
                vec2 grad = normalize(vec2(-dzdx, -dzdy) + 1e-6);
                vec2 lightDir = normalize(vec2(-0.707, 0.707));
                float align = dot(grad, lightDir);
                float diag = pow(max(0.0, align), 3.5) + pow(max(0.0, -align), 4.5) * 0.72;

                float hairline = smoothstep(0.0030, 0.0004, distIn);
                float bevelSheen = smoothstep(uBevel * 0.55, 0.001, distIn) * (1.0 - smoothstep(0.001, 0.0, distIn));

                glassColor += vec3(1.0) * hairline * (0.12 + 0.85 * diag);
                glassColor += mix(vec3(1.0), transmitted + 0.2, 0.25) * bevelSheen * (0.05 + 0.28 * diag);

                gl_FragColor = vec4(mix(bgColor, glassColor, mask), 1.0);
            }
        `;

        let material = null;
        const loader = new THREE.TextureLoader();
        const imgUrl = 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop';

        loader.load(imgUrl, (texture) => {
            document.getElementById('loading').style.display = 'none';
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            material = new THREE.ShaderMaterial({
                uniforms: {
                    uImage: { value: texture },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uImageRes: { value: new THREE.Vector2(texture.image.width, texture.image.height) },
                    uPos: { value: glass.pos.clone() },
                    uStretch: { value: glass.stretch.clone() },
                    uScale: { value: 1.0 },
                    uShape: { value: params.shape },
                    uNd: { value: params.mat.nd },
                    uCauchyB: { value: params.mat.cauchyB },
                    uAbsorption: { value: new THREE.Vector3(...params.mat.absorption) },
                    uThickness: { value: params.thickness },
                    uBevel: { value: params.bevel },
                    uFrost: { value: params.frost }
                },
                vertexShader,
                fragmentShader
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
            scene.add(plane);
        });

        // --- 5. OVLÁDÁNÍ ---
        function updateTarget(clientX, clientY) {
            target.x = (clientX / window.innerWidth) * aspect;
            target.y = 1.0 - clientY / window.innerHeight;
        }

        window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.clientX, e.clientY);
            glass.targetScale = 1.14;
        });
        window.addEventListener('mouseup', () => { glass.targetScale = 1.0; });
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
            glass.targetScale = 1.14;
        }, { passive: true });
        window.addEventListener('touchmove', (e) => updateTarget(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        window.addEventListener('touchend', () => { glass.targetScale = 1.0; });

        // --- 6. UI LOGIKA ---
        const ui = document.getElementById('ui');
        const uiToggle = document.getElementById('uiToggle');
        const uiToggleLabel = document.getElementById('uiToggleLabel');
        uiToggle.addEventListener('click', () => {
            ui.classList.toggle('collapsed');
            uiToggleLabel.textContent = ui.classList.contains('collapsed') ? 'Show' : 'Hide';
        });

        document.querySelectorAll('.shape-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                params.shape = parseInt(btn.dataset.shape, 10);
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.querySelectorAll('.mat-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                params.mat = materials[btn.dataset.mat];
                document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        const sliderKeys = ['omega', 'zeta', 'thickness', 'bevel', 'frost'];
        for (const key of sliderKeys) {
            document.getElementById(key).addEventListener('input', (e) => {
                params[key] = parseFloat(e.target.value);
                const label = document.getElementById('val-' + key);
                label.textContent = key === 'omega' ? params[key].toFixed(1) :
                                    (key === 'thickness' || key === 'bevel') ? params[key].toFixed(3) :
                                    params[key].toFixed(2);
            });
        }

        // --- 7. RENDER LOOP ---
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 1 / 30);
            lastTime = now;

            const substeps = 2;
            const subDt = dt / substeps;
            for (let i = 0; i < substeps; i++) {
                stepPhysics(subDt);
            }

            if (material) {
                material.uniforms.uPos.value.copy(glass.pos);
                material.uniforms.uStretch.value.copy(glass.stretch);
                material.uniforms.uScale.value = glass.scale;
                material.uniforms.uShape.value = params.shape;
                material.uniforms.uNd.value = params.mat.nd;
                material.uniforms.uCauchyB.value = params.mat.cauchyB;
                material.uniforms.uAbsorption.value.set(...params.mat.absorption);
                material.uniforms.uThickness.value = params.thickness;
                material.uniforms.uBevel.value = params.bevel;
                material.uniforms.uFrost.value = params.frost;

                renderer.render(scene, camera);
            }
        }

        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            aspect = w / h;
            renderer.setSize(w, h);
            if (material) {
                material.uniforms.uResolution.value.set(w, h);
            }
        });
    </script>
</body>
</html>
