<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Blob — Real Spring Physics & Optical Dispersion</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; cursor: none; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10;
        }

        /* Minimalistický Liquid Glass UI panel */
        #ui {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 268px;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(14, 16, 24, 0.55);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            z-index: 20;
            cursor: default;
        }
        #ui.collapsed .ui-body { display: none; }
        .ui-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
        }
        .ui-toggle {
            font-size: 11px;
            opacity: 0.65;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
        }
        .ui-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        button.preset-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        button.preset-btn:hover { background: rgba(255, 255, 255, 0.15); }
        button.preset-btn.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
        }
        .control { display: flex; flex-direction: column; gap: 4px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.78);
            font-size: 11px;
        }
        .control-label span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.95);
        }
        input[type="range"] {
            width: 100%;
            accent-color: #a5d8ff;
            cursor: pointer;
            margin: 0;
        }
        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Liquid Glass...</div>

    <div id="ui">
        <div class="ui-header" id="uiToggle">
            <span>Liquid Glass Blob</span>
            <span class="ui-toggle" id="uiToggleLabel">Hide</span>
        </div>
        <div class="ui-body">
            <div class="presets">
                <button class="preset-btn active" data-preset="liquidGlass">Liquid Glass</button>
                <button class="preset-btn" data-preset="jelly">Elastic Jelly</button>
                <button class="preset-btn" data-preset="mercury">Mercury Drop</button>
                <button class="preset-btn" data-preset="lens">Soft Lens</button>
            </div>

            <div class="control">
                <div class="control-label"><span>Pružení (Spring k)</span><span id="val-spring">140</span></div>
                <input type="range" id="spring" min="30" max="350" step="5" value="140">
            </div>
            <div class="control">
                <div class="control-label"><span>Tlumení (Damping)</span><span id="val-damping">9.5</span></div>
                <input type="range" id="damping" min="2.0" max="24.0" step="0.5" value="9.5">
            </div>
            <div class="control">
                <div class="control-label"><span>Velikost (Radius)</span><span id="val-radius">0.14</span></div>
                <input type="range" id="radius" min="0.06" max="0.28" step="0.005" value="0.14">
            </div>
            <div class="control">
                <div class="control-label"><span>Index lomu (IOR)</span><span id="val-ior">1.50</span></div>
                <input type="range" id="ior" min="1.05" max="2.20" step="0.01" value="1.50">
            </div>
            <div class="control">
                <div class="control-label"><span>Disperze (Chromatic)</span><span id="val-dispersion">0.09</span></div>
                <input type="range" id="dispersion" min="0.0" max="0.25" step="0.005" value="0.09">
            </div>
            <div class="control">
                <div class="control-label"><span>Hloubka čočky (Depth)</span><span id="val-depth">0.24</span></div>
                <input type="range" id="depth" min="0.02" max="0.60" step="0.01" value="0.24">
            </div>

            <div class="hint">Pohybuj myší • Klikni pro odskok</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. PARAMS & PRESETS ---
        const params = {
            spring: 140.0,     // Tuhost pružiny sledování a kmitání tvaru
            damping: 9.5,      // Viskózní tlumení (nižší = víc želé pružení)
            radius: 0.14,      // Základní poloměr kapky (v poměru k výšce obrazovky)
            ior: 1.50,         // Index lomu skla
            dispersion: 0.09,  // Spektrální disperze (reálná chromatická aberace)
            depth: 0.24        // Optická tloušťka / síla čočky
        };

        const presets = {
            liquidGlass: { spring: 140, damping: 9.5,  radius: 0.14, ior: 1.50, dispersion: 0.09, depth: 0.24 },
            jelly:       { spring: 210, damping: 4.5,  radius: 0.15, ior: 1.40, dispersion: 0.06, depth: 0.28 },
            mercury:     { spring: 180, damping: 12.0, radius: 0.12, ior: 1.95, dispersion: 0.14, depth: 0.34 },
            lens:        { spring: 95,  damping: 14.0, radius: 0.18, ior: 1.35, dispersion: 0.03, depth: 0.18 }
        };

        // --- 2. RENDERER & SCÉNA ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        // --- 3. FYZIKA BLOBU (Spring-Damper + Squash & Stretch + Surface Modes + Tail Droplet) ---
        // Pracujeme v aspektově korigovaných souřadnicích: x in [0..aspect], y in [0..1]
        let aspect = window.innerWidth / window.innerHeight;
        const target = new THREE.Vector2(0.5 * aspect, 0.5);

        const blob = {
            pos: new THREE.Vector2(0.5 * aspect, 0.5),
            vel: new THREE.Vector2(0, 0),
            prevVel: new THREE.Vector2(0, 0),
            // Sekundární "ocasní" kapka pro efekt povrchového napětí při rychlém pohybu
            tailPos: new THREE.Vector2(0.5 * aspect, 0.5),
            tailVel: new THREE.Vector2(0, 0),
            // Radiální pružení (při kliknutí se kapka nafoukne a zavibruje)
            radScale: 1.0,
            radVel: 0.0,
            // Harmonické módy obvodu kapky (n=2 ovál, n=3 trojúhelníková vlna, n=4 čtyřlístek)
            mode2: 0.0, mode2Vel: 0.0, mode2Angle: 0.0,
            mode3: 0.0, mode3Vel: 0.0, mode3Angle: 0.0,
            mode4: 0.0, mode4Vel: 0.0, mode4Angle: 0.0
        };

        function stepPhysics(dt) {
            const k = params.spring;
            const c = params.damping;

            // 1) Pružina hlavní pozice (Hooke + tlumení)
            const dx = target.x - blob.pos.x;
            const dy = target.y - blob.pos.y;
            const ax = k * dx - c * blob.vel.x;
            const ay = k * dy - c * blob.vel.y;

            blob.prevVel.copy(blob.vel);
            blob.vel.x += ax * dt;
            blob.vel.y += ay * dt;
            blob.pos.x += blob.vel.x * dt;
            blob.pos.y += blob.vel.y * dt;

            // Zrychlení v tomto kroku (budí povrchové kmitání kapky)
            const dvx = (blob.vel.x - blob.prevVel.x) / Math.max(dt, 1e-4);
            const dvy = (blob.vel.y - blob.prevVel.y) / Math.max(dt, 1e-4);
            const accelMag = Math.hypot(dvx, dvy);
            const accelAngle = Math.atan2(dvy, dvx);

            // 2) Sekundární kapka na měkčí pružině (táhne se za hlavní a spojuje se přes smin)
            const kTail = k * 0.48;
            const cTail = c * 0.85;
            const tax = kTail * (blob.pos.x - blob.tailPos.x) - cTail * blob.tailVel.x;
            const tay = kTail * (blob.pos.y - blob.tailPos.y) - cTail * blob.tailVel.y;
            blob.tailVel.x += tax * dt;
            blob.tailVel.y += tay * dt;
            blob.tailPos.x += blob.tailVel.x * dt;
            blob.tailPos.y += blob.tailVel.y * dt;

            // 3) Radiální pružení (návrat k radScale = 1.0)
            const kRad = k * 2.2;
            const cRad = c * 0.65;
            const aRad = kRad * (1.0 - blob.radScale) - cRad * blob.radVel;
            blob.radVel += aRad * dt;
            blob.radScale += blob.radVel * dt;

            // 4) Povrchové harmonické módy (reálné vlnění okraje kapky při zrychlení)
            if (accelMag > 0.5) {
                const excite = Math.min(accelMag * 0.008, 0.25);
                blob.mode2Vel += Math.cos(2.0 * (accelAngle - blob.mode2Angle)) * excite * 12.0;
                blob.mode3Vel += Math.sin(3.0 * (accelAngle - blob.mode3Angle)) * excite * 7.0;
                blob.mode2Angle = accelAngle;
                blob.mode3Angle = accelAngle + 0.7;
            }

            // Pružinové oscilátory pro módy 2, 3, 4
            const kM2 = k * 1.8, cM2 = c * 0.55;
            blob.mode2Vel += (-kM2 * blob.mode2 - cM2 * blob.mode2Vel) * dt;
            blob.mode2 += blob.mode2Vel * dt;
            blob.mode2 = Math.max(-0.28, Math.min(0.28, blob.mode2));

            const kM3 = k * 2.8, cM3 = c * 0.50;
            blob.mode3Vel += (-kM3 * blob.mode3 - cM3 * blob.mode3Vel) * dt;
            blob.mode3 += blob.mode3Vel * dt;
            blob.mode3 = Math.max(-0.18, Math.min(0.18, blob.mode3));

            const kM4 = k * 3.8, cM4 = c * 0.45;
            blob.mode4Vel += (-kM4 * blob.mode4 - cM4 * blob.mode4Vel) * dt;
            blob.mode4 += blob.mode4Vel * dt;
            blob.mode4 = Math.max(-0.12, Math.min(0.12, blob.mode4));
        }

        // --- 4. SHADER (SDF Blob + 3D Dome Normals + Snell Refraction + 5-band Dispersion) ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform sampler2D uImage;
            uniform vec2 uResolution;
            uniform vec2 uImageRes;

            uniform vec2 uBlobPos;       // v aspektově korigovaném prostoru (x: 0..aspect, y: 0..1)
            uniform vec2 uBlobVel;
            uniform vec2 uTailPos;
            uniform float uRadius;
            uniform float uRadScale;
            uniform vec3 uModes;         // x: mode2, y: mode3, z: mode4
            uniform vec3 uModeAngles;    // úhly módů

            uniform float uIOR;
            uniform float uDispersion;
            uniform float uDepth;

            varying vec2 vUv;

            vec2 cover(vec2 uv, vec2 resolution, vec2 texResolution) {
                vec2 s = resolution;
                vec2 i = texResolution;
                float rs = s.x / s.y;
                float ri = i.x / i.y;
                vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
                vec2 offset = (rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0)) / newSize;
                return uv * s / newSize + offset;
            }

            // Smooth minimum pro spojení kapek povrchovým napětím
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Signed Distance Field tekutého blobu (squash & stretch + harmonické vlny)
            float blobSDF(vec2 p) {
                vec2 d = p - uBlobPos;

                // Squash & stretch podle směru rychlosti (zachování objemu)
                float speed = length(uBlobVel);
                float stretch = 1.0 + min(speed * 0.22, 0.35);
                float squash = 1.0 / stretch;

                vec2 dir = speed > 0.001 ? uBlobVel / speed : vec2(1.0, 0.0);
                vec2 perp = vec2(-dir.y, dir.x);

                vec2 localD = vec2(dot(d, dir) / stretch, dot(d, perp) / squash);
                float distMain = length(localD);

                // Úhel pro povrchové módy pružení
                float theta = atan(d.y, d.x);
                float wobble =
                    uModes.x * cos(2.0 * (theta - uModeAngles.x)) +
                    uModes.y * cos(3.0 * (theta - uModeAngles.y)) +
                    uModes.z * cos(4.0 * (theta - uModeAngles.z));

                float rMain = uRadius * uRadScale * (1.0 + wobble);
                float sdfMain = distMain - rMain;

                // Menší ocasní kapka spojená přes smin (povrchové napětí)
                float rTail = uRadius * 0.48 * clamp(0.6 + speed * 0.25, 0.6, 1.0);
                float sdfTail = length(p - uTailPos) - rTail;

                return smin(sdfMain, sdfTail, uRadius * 0.45);
            }

            // Výška 3D kopule kapky (0 na okraji, 1 uprostřed)
            float domeHeight(float sdf) {
                float t = clamp(-sdf / (uRadius * 0.85), 0.0, 1.0);
                // Hladký profil kapky (kulatý okraj + měkká špička)
                return sqrt(max(0.0, 1.0 - (1.0 - t) * (1.0 - t)));
            }

            vec2 refractUV(vec2 baseUv, vec3 viewDir, vec3 normal, float ior, float thickness) {
                float eta = 1.0 / ior;
                vec3 refracted = refract(viewDir, normal, eta);
                vec2 offset = refracted.xy / max(abs(refracted.z), 0.15) * thickness;
                return clamp(baseUv + offset, 0.001, 0.999);
            }

            void main() {
                float aspect = uResolution.x / uResolution.y;
                vec2 p = vec2(vUv.x * aspect, vUv.y);
                vec2 bgUv = cover(vUv, uResolution, uImageRes);

                float sdf = blobSDF(p);

                // Pozadí + jemný stín pod skleněným blobem (reakce s pozadím)
                vec3 bgColor = texture2D(uImage, bgUv).rgb;
                float shadowSdf = blobSDF(p - vec2(0.012, -0.016));
                float shadow = smoothstep(uRadius * 0.35, -uRadius * 0.05, shadowSdf);
                bgColor *= 1.0 - shadow * 0.32;

                // Hladký antialiasing okraje kapky
                float aa = 0.0025;
                float mask = smoothstep(aa, -aa, sdf);

                if (mask <= 0.001) {
                    gl_FragColor = vec4(bgColor, 1.0);
                    return;
                }

                // 1. Výpočet 3D normály kopule kapky pomocí gradientu výšky
                float eps = 0.0025;
                float hC = domeHeight(sdf);
                float hR = domeHeight(blobSDF(p + vec2(eps, 0.0)));
                float hL = domeHeight(blobSDF(p - vec2(eps, 0.0)));
                float hT = domeHeight(blobSDF(p + vec2(0.0, eps)));
                float hB = domeHeight(blobSDF(p - vec2(0.0, eps)));

                float dHx = (hR - hL) / (2.0 * eps);
                float dHy = (hT - hB) / (2.0 * eps);

                // Normála směřuje ven z kapky; na okraji je strmá, uprostřed míří k pozorovateli
                float slopeScale = uRadius * 1.15;
                vec3 normal = normalize(vec3(-dHx * slopeScale, -dHy * slopeScale, 1.0));

                vec3 viewDir = normalize(vec3((vUv - 0.5) * 0.18, -1.0));
                float thickness = uDepth * (0.35 + hC * 0.95);

                // 2. REÁLNÁ CHROMATICKÁ ABERACE (5-pásmová spektrální disperze)
                vec2 uvR = refractUV(bgUv, viewDir, normal, uIOR - uDispersion * 1.00, thickness);
                vec2 uvY = refractUV(bgUv, viewDir, normal, uIOR - uDispersion * 0.35, thickness);
                vec2 uvG = refractUV(bgUv, viewDir, normal, uIOR,                      thickness);
                vec2 uvC = refractUV(bgUv, viewDir, normal, uIOR + uDispersion * 0.45, thickness);
                vec2 uvB = refractUV(bgUv, viewDir, normal, uIOR + uDispersion * 1.15, thickness);

                vec3 cR = texture2D(uImage, uvR).rgb;
                vec3 cY = texture2D(uImage, uvY).rgb;
                vec3 cG = texture2D(uImage, uvG).rgb;
                vec3 cC = texture2D(uImage, uvC).rgb;
                vec3 cB = texture2D(uImage, uvB).rgb;

                vec3 refractedColor = vec3(
                    cR.r * 0.65 + cY.r * 0.35,
                    cY.g * 0.22 + cG.g * 0.56 + cC.g * 0.22,
                    cC.b * 0.35 + cB.b * 0.65
                );

                // Jemná koncentrace světla (kaustika) uvnitř čočky
                refractedColor *= 1.0 + hC * 0.08;

                // 3. FRESNELŮV ODRAZ na zakřiveném okraji kapky
                float f0 = pow((1.0 - uIOR) / (1.0 + uIOR), 2.0);
                float cosTheta = clamp(dot(-viewDir, normal), 0.0, 1.0);
                float fresnel = f0 + (1.0 - f0) * pow(1.0 - cosTheta, 4.5);

                vec3 reflDir = reflect(viewDir, normal);
                float skyGrad = smoothstep(-0.2, 0.8, reflDir.y);
                vec3 envColor = mix(vec3(0.08, 0.12, 0.18), vec3(0.85, 0.94, 1.0), skyGrad);

                // 4. MOKRÉ SPECULAR ODLESKY (hlavní světlo + protisvětlo)
                vec3 lightDir1 = normalize(vec3(-0.55, 0.75, 0.85));
                vec3 lightDir2 = normalize(vec3(0.65, -0.5, 0.55));
                vec3 halfVec1 = normalize(lightDir1 - viewDir);
                vec3 halfVec2 = normalize(lightDir2 - viewDir);

                float spec1 = pow(max(dot(normal, halfVec1), 0.0), 110.0) * 0.95;
                float spec2 = pow(max(dot(normal, halfVec2), 0.0), 42.0) * 0.30;

                // Jemný skleněný lem na samém okraji kapky
                float rim = smoothstep(0.32, 0.0, hC) * 0.22;

                vec3 glassColor = mix(refractedColor, envColor, fresnel * 0.8);
                glassColor += vec3(1.0, 0.99, 0.96) * spec1;
                glassColor += vec3(0.72, 0.90, 1.0) * (spec2 + rim);

                vec3 finalColor = mix(bgColor, glassColor, mask);
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        let material = null;
        const loader = new THREE.TextureLoader();
        const imgUrl = 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop';

        loader.load(imgUrl, (texture) => {
            document.getElementById('loading').style.display = 'none';
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            material = new THREE.ShaderMaterial({
                uniforms: {
                    uImage: { value: texture },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uImageRes: { value: new THREE.Vector2(texture.image.width, texture.image.height) },
                    uBlobPos: { value: blob.pos.clone() },
                    uBlobVel: { value: blob.vel.clone() },
                    uTailPos: { value: blob.tailPos.clone() },
                    uRadius: { value: params.radius },
                    uRadScale: { value: 1.0 },
                    uModes: { value: new THREE.Vector3() },
                    uModeAngles: { value: new THREE.Vector3() },
                    uIOR: { value: params.ior },
                    uDispersion: { value: params.dispersion },
                    uDepth: { value: params.depth }
                },
                vertexShader,
                fragmentShader
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
            scene.add(plane);
        });

        // --- 5. OVLÁDÁNÍ MYŠÍ / DOTYKEM ---
        function updateTarget(clientX, clientY) {
            target.x = (clientX / window.innerWidth) * aspect;
            target.y = 1.0 - clientY / window.innerHeight;
        }

        window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.clientX, e.clientY);
            // Impuls při kliknutí: kapka se smrští a pružně odskočí
            blob.radVel -= 3.8;
            blob.mode2Vel += 3.2;
            blob.mode4Vel -= 2.4;
        });
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#ui')) return;
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
            blob.radVel -= 3.8;
            blob.mode2Vel += 3.2;
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            updateTarget(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        // --- 6. UI LOGIKA ---
        const ui = document.getElementById('ui');
        const uiToggle = document.getElementById('uiToggle');
        const uiToggleLabel = document.getElementById('uiToggleLabel');
        uiToggle.addEventListener('click', () => {
            ui.classList.toggle('collapsed');
            uiToggleLabel.textContent = ui.classList.contains('collapsed') ? 'Show' : 'Hide';
        });

        const sliderKeys = ['spring', 'damping', 'radius', 'ior', 'dispersion', 'depth'];
        function syncUI() {
            for (const key of sliderKeys) {
                const input = document.getElementById(key);
                const label = document.getElementById('val-' + key);
                input.value = params[key];
                label.textContent = key === 'spring' ? params[key].toFixed(0) :
                                    key === 'damping' ? params[key].toFixed(1) :
                                    params[key].toFixed(2);
            }
        }

        for (const key of sliderKeys) {
            document.getElementById(key).addEventListener('input', (e) => {
                params[key] = parseFloat(e.target.value);
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                syncUI();
            });
        }

        document.querySelectorAll('.preset-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const p = presets[btn.dataset.preset];
                Object.assign(params, p);
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                syncUI();
            });
        });

        // --- 7. RENDER & PHYSICS LOOP ---
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min((now - lastTime) / 1000, 1 / 30);
            lastTime = now;

            // Substeps pro stabilní pružinu i při vysokém k
            const substeps = 3;
            const subDt = dt / substeps;
            for (let i = 0; i < substeps; i++) {
                stepPhysics(subDt);
            }

            if (material) {
                material.uniforms.uBlobPos.value.copy(blob.pos);
                material.uniforms.uBlobVel.value.copy(blob.vel);
                material.uniforms.uTailPos.value.copy(blob.tailPos);
                material.uniforms.uRadius.value = params.radius;
                material.uniforms.uRadScale.value = blob.radScale;
                material.uniforms.uModes.value.set(blob.mode2, blob.mode3, blob.mode4);
                material.uniforms.uModeAngles.value.set(blob.mode2Angle, blob.mode3Angle, blob.mode4Angle);
                material.uniforms.uIOR.value = params.ior;
                material.uniforms.uDispersion.value = params.dispersion;
                material.uniforms.uDepth.value = params.depth;

                renderer.render(scene, camera);
            }
        }

        requestAnimationFrame(animate);

        // --- 8. RESIZE ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            aspect = w / h;
            renderer.setSize(w, h);
            if (material) {
                material.uniforms.uResolution.value.set(w, h);
            }
        });
    </script>
</body>
</html>
